---
- name: Prepare benchmark host
  hosts: bench_hosts
  become: true

  vars:
    bench_user: bench
    user_shell: /usr/bin/fish
    bench_repo_dir: "/home/{{ bench_user }}/aoc-bench"
    bench_repo_url: "https://github.com/ictrobot/aoc-bench.git"
    bench_repo_branch: master
    cloudflare_env_file: "/home/{{ bench_user }}/.config/aoc-bench/cloudflare.env"
    bench_home_dir: "/home/{{ bench_user }}"
    bench_home_lv: benchhome

  pre_tasks:
    - name: Set timezone to UTC
      become: true
      community.general.timezone:
        name: Etc/UTC

    - name: Ensure APT cache is up to date
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

  tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Cancel any pending rbench resume of aoc-bench
      ansible.builtin.file:
        path: /run/aoc-bench-rbench/paused
        state: absent

    - name: Stop aoc-bench service before updates
      ansible.builtin.systemd:
        name: aoc-bench.service
        state: stopped
      when: "'aoc-bench.service' in ansible_facts.services"

    - name: Upgrade all packages to latest
      ansible.builtin.apt:
        upgrade: dist
        autoremove: true

    - name: Install tools
      ansible.builtin.apt:
        name:
          - fish
          - acl
          - ufw
          - build-essential
          - git
          - curl
          - wget
          - htop
          - screen
          - lm-sensors
          - lvm2
          - linux-perf
          - strace
          - hwloc-nox
          - jq
          - tuned
          - stress-ng
          - s-tui
          - btop
          - gdu
          - sqlite3
          - sqlite3-tools
          - valgrind
          - time
          - hyperfine
          - icdiff
          - nvme-cli
          - smartmontools
          - nodejs
          - npm
          - powercap-utils
          - btrfs-progs
          - btrfs-compsize
        state: present

    - name: Change root shell
      ansible.builtin.user:
        name: root
        shell: "{{ user_shell }}"

    # Firewall
    - name: Validate allowed SSH subnets
      ansible.builtin.assert:
        that:
          - ssh_allowed_subnets is defined
          - ssh_allowed_subnets is sequence
          - ssh_allowed_subnets is not string
          - ssh_allowed_subnets | length > 0
          - (ssh_allowed_subnets | reject('string') | list | length) == 0
          - (ssh_allowed_subnets | select('search', '/') | list | length) == (ssh_allowed_subnets | length)
          - (ssh_allowed_subnets | ansible.utils.ipaddr | length) == (ssh_allowed_subnets | length)
        fail_msg: >-
          Define ssh_allowed_subnets in inventory as a non-empty YAML list of IPv4/IPv6 CIDR networks,
          for example `["203.0.113.1/32", "2001:db8::/48"]`.

    - name: Enable UFW logging
      community.general.ufw:
        logging: 'on'
      become: true

    - name: Allow SSH from allowed subnets
      community.general.ufw:
        rule: allow
        direction: in
        port: 22
        proto: tcp
        src: "{{ item }}"
      loop: "{{ ssh_allowed_subnets }}"
      become: true

    - name: Remove SSH allow any rule
      community.general.ufw:
        rule: allow
        direction: in
        port: 22
        proto: tcp
        src: any
        delete: true
      become: true

    - name: Deny incoming traffic
      community.general.ufw:
        direction: incoming
        policy: deny
      become: true

    - name: Allow outgoing traffic
      community.general.ufw:
        direction: outgoing
        policy: allow
      become: true

    - name: Enable UFW
      community.general.ufw:
        state: enabled
      become: true

    # Allow perf access
    - name: Allow users to profile their own processes in userspace
      ansible.posix.sysctl:
        name: kernel.perf_event_paranoid
        value: "1"
        sysctl_set: true
        reload: true

    # CPU partitioning and tuning
    - name: Validate CPU isolation config
      ansible.builtin.assert:
        that:
          - isolated_cores is defined
          - isolated_cores | length > 0
        fail_msg: "Define isolated_cores when bench_enable_tuned_cpu_partitioning is true."
      when: bench_enable_tuned_cpu_partitioning | bool

    - name: Enabled tuned service
      ansible.builtin.systemd:
        name: tuned
        enabled: true
        state: started
      when: bench_enable_tuned_cpu_partitioning | bool

    # Don't set no_balance_cores=(/isolcpus) as that would disable scheduler load balancing on those cores, which is
    # required for multithreaded benchmarks without pinning threads to specific cores.
    - name: Configure tuned cpu-partitioning profile
      ansible.builtin.lineinfile:
        path: /etc/tuned/cpu-partitioning-variables.conf
        regexp: '^isolated_cores=.+'
        line: 'isolated_cores={{ isolated_cores }}'
      when: bench_enable_tuned_cpu_partitioning | bool

    # Custom profile inheriting cpu-partitioning but with intel_pstate re-enabled
    # for max turbo boost. See /usr/lib/tuned/profiles/cpu-partitioning/tuned.conf
    # which also includes network-latency and latency-performance.
    - name: Ensure tuned aoc-bench profile directory exists
      ansible.builtin.file:
        path: /etc/tuned/profiles/aoc-bench
        state: directory
        owner: root
        group: root
        mode: "0755"
      when: bench_enable_tuned_cpu_partitioning | bool

    - name: Install custom tuned aoc-bench profile
      ansible.builtin.copy:
        src: files/tuned.conf
        dest: /etc/tuned/profiles/aoc-bench/tuned.conf
        owner: root
        group: root
        mode: "0644"
      when: bench_enable_tuned_cpu_partitioning | bool

    - name: Check current tuned profile
      ansible.builtin.command: tuned-adm active
      register: tuned_profile
      changed_when: false
      failed_when: false

    - name: Enable tuned aoc-bench profile
      ansible.builtin.command: tuned-adm profile aoc-bench
      changed_when: true
      when:
        - bench_enable_tuned_cpu_partitioning | bool
        - "'Current active profile: aoc-bench' not in tuned_profile.stdout"

    - name: Disable active tuned profile when CPU partitioning is disabled
      ansible.builtin.command: tuned-adm off
      changed_when: true
      when:
        - not bench_enable_tuned_cpu_partitioning | bool
        - "'Current active profile:' in tuned_profile.stdout"

    - name: Disable tuned service when CPU partitioning is disabled
      ansible.builtin.systemd:
        name: tuned
        enabled: false
        state: stopped
      when:
        - not bench_enable_tuned_cpu_partitioning | bool

    - name: Check kernel cmdline
      ansible.builtin.command: cat /proc/cmdline
      register: cmdline
      changed_when: false
      check_mode: false

    - name: Reboot to apply CPU isolation state
      ansible.builtin.reboot:
        reboot_timeout: 600
      when: >-
        (
          bench_enable_tuned_cpu_partitioning | bool
          and (
            ("nohz_full=" ~ isolated_cores) not in cmdline.stdout
            or "intel_pstate=disable" in cmdline.stdout
          )
        )
        or (
          not bench_enable_tuned_cpu_partitioning | bool
          and (
            "nohz_full=" in cmdline.stdout
            or "rcu_nocbs=" in cmdline.stdout
            or "tuned.non_isolcpus=" in cmdline.stdout
            or "isolcpus=" in cmdline.stdout
            or "intel_pstate=disable" in cmdline.stdout
          )
        )

    - name: Disable unattended upgrades
      ansible.builtin.systemd:
        name: apt-daily-upgrade.timer
        enabled: false
        state: stopped

    # Compressed BTRFS LV for bench user
    - name: Create benchmark home logical volume
      community.general.lvol:
        vg: "{{ bench_home_vg }}"
        lv: "{{ bench_home_lv }}"
        size: "{{ bench_home_size }}"
        shrink: false
        state: present

    - name: Format benchmark home volume as btrfs
      community.general.filesystem:
        dev: "/dev/{{ bench_home_vg }}/{{ bench_home_lv }}"
        fstype: btrfs
        resizefs: true

    - name: Ensure benchmark home directory exists
      ansible.builtin.file:
        path: "{{ bench_home_dir }}"
        state: directory
        mode: "0700"

    - name: Mount benchmark home volume
      ansible.posix.mount:
        path: "{{ bench_home_dir }}"
        src: "/dev/{{ bench_home_vg }}/{{ bench_home_lv }}"
        fstype: btrfs
        opts: defaults,compress=zstd:3,noatime
        state: mounted

    # User setup
    - name: Ensure bench user exists
      ansible.builtin.user:
        name: "{{ bench_user }}"
        shell: "{{ user_shell }}"
        create_home: true
        state: present

    - name: Ensure benchmark home ownership
      ansible.builtin.file:
        path: "{{ bench_home_dir }}"
        state: directory
        owner: "{{ bench_user }}"
        group: "{{ bench_user }}"
        mode: "0700"

    - name: Add SSH key for bench user
      ansible.posix.authorized_key:
        user: "{{ bench_user }}"
        key: "{{ bench_ssh_pubkey }}"
        state: present

    # Package power for power_limit_watts. The RAPL energy counters are root-only by default (they
    # can be used as a side channel), so a udev rule opens them to a dedicated group instead.
    - name: Validate power limit config
      ansible.builtin.assert:
        that:
          - power_limit_watts > 0
        fail_msg: "power_limit_watts must be positive."
      when: power_limit_watts is defined

    - name: Ensure rapl group exists
      ansible.builtin.group:
        name: rapl
        system: true
        state: present
      when: power_limit_watts is defined

    - name: Add bench user to rapl group
      ansible.builtin.user:
        name: "{{ bench_user }}"
        groups: rapl
        append: true
      when: power_limit_watts is defined

    - name: Install udev rule for RAPL energy counters
      ansible.builtin.copy:
        src: files/90-aoc-bench-rapl.rules
        dest: /etc/udev/rules.d/90-aoc-bench-rapl.rules
        owner: root
        group: root
        mode: "0644"
      register: rapl_udev_rule
      when: power_limit_watts is defined

    - name: Apply udev rule for RAPL energy counters
      ansible.builtin.shell: |
        udevadm control --reload-rules
        udevadm trigger --action=add --subsystem-match=powercap
        udevadm settle
      changed_when: true
      when:
        - power_limit_watts is defined
        - rapl_udev_rule.changed

    - name: Remove udev rule for RAPL energy counters
      ansible.builtin.file:
        path: /etc/udev/rules.d/90-aoc-bench-rapl.rules
        state: absent
      when: power_limit_watts is not defined

    - name: Check whether rustup is already installed for bench user
      become: true
      become_user: "{{ bench_user }}"
      ansible.builtin.stat:
        path: "~{{ bench_user }}/.cargo/bin/rustup"
      register: bench_rustup

    - name: Download rustup installer for bench user
      become: true
      become_user: "{{ bench_user }}"
      ansible.builtin.get_url:
        url: https://sh.rustup.rs
        dest: "~{{ bench_user }}/rustup-init.sh"
        mode: "0755"
      when: not bench_rustup.stat.exists

    - name: Install rustup for bench user
      become: true
      become_user: "{{ bench_user }}"
      ansible.builtin.command: "~{{ bench_user }}/rustup-init.sh -y"
      args:
        creates: "~{{ bench_user }}/.cargo/bin/rustup"
      when: not bench_rustup.stat.exists

    - name: Remove rustup installer for bench user
      become: true
      become_user: "{{ bench_user }}"
      ansible.builtin.file:
        path: "~{{ bench_user }}/rustup-init.sh"
        state: absent

    - name: Ensure benchmark repo is cloned
      become: true
      become_user: "{{ bench_user }}"
      ansible.builtin.git:
        repo: "{{ bench_repo_url }}"
        dest: "{{ bench_repo_dir }}"
        version: "{{ bench_repo_branch }}"
        accept_hostkey: true
        update: true
        force: false

    - name: Ensure host config directory exists
      become: true
      become_user: "{{ bench_user }}"
      ansible.builtin.file:
        path: "{{ bench_repo_dir }}/data/hosts"
        state: directory
        owner: "{{ bench_user }}"
        group: "{{ bench_user }}"
        mode: "0755"

    - name: Write host config
      become: true
      become_user: "{{ bench_user }}"
      ansible.builtin.copy:
        content: "{{ host_config | to_nice_json }}\n"
        dest: "{{ bench_repo_dir }}/data/hosts/{{ inventory_hostname }}.json"
        owner: "{{ bench_user }}"
        group: "{{ bench_user }}"
        mode: "0644"
      vars:
        host_config: >-
          {{
            {}
            | combine({'cpu_affinity': isolated_cores} if isolated_cores is defined else {})
            | combine({'description': host_description} if host_description is defined else {})
            | combine({'power_limit_watts': power_limit_watts} if power_limit_watts is defined else {})
          }}

    - name: Ensure benchmark config directory exists
      ansible.builtin.file:
        path: "/home/{{ bench_user }}/.config/aoc-bench"
        state: directory
        owner: "{{ bench_user }}"
        group: "{{ bench_user }}"
        mode: "0700"

    - name: Ensure benchmark state directory exists
      ansible.builtin.file:
        path: "/home/{{ bench_user }}/.local/state/aoc-bench"
        state: directory
        owner: "{{ bench_user }}"
        group: "{{ bench_user }}"
        mode: "0700"

    - name: Check whether Cloudflare env file exists
      ansible.builtin.stat:
        path: "{{ cloudflare_env_file }}"
      register: cloudflare_env
      when: bench_enable_web_export | bool

    - name: Ensure Cloudflare env file has strict permissions when present
      ansible.builtin.file:
        path: "{{ cloudflare_env_file }}"
        state: file
        owner: "{{ bench_user }}"
        group: "{{ bench_user }}"
        mode: "0600"
      when:
        - bench_enable_web_export | bool
        - cloudflare_env.stat.exists | default(false)

    - name: Check wrangler version
      ansible.builtin.command: wrangler --version
      register: wrangler_version
      changed_when: false
      failed_when: false
      when: bench_enable_web_export | bool

    - name: Install wrangler v4 globally
      ansible.builtin.command: npm install -g wrangler@4
      when:
        - bench_enable_web_export | bool
        - (wrangler_version.rc | default(1)) != 0 or (wrangler_version.stdout | default('') is not search('^4\\.'))
      changed_when: true

    # Where bench-all.sh copies the built aoc-bench and host config for rbench runs
    - name: Ensure aoc-bench shared directory exists
      ansible.builtin.file:
        path: /var/lib/aoc-bench
        state: directory
        owner: "{{ bench_user }}"
        group: "{{ bench_user }}"
        mode: "0755"

    - name: Install aoc-bench systemd unit
      ansible.builtin.template:
        src: templates/aoc-bench.service.j2
        dest: /etc/systemd/system/aoc-bench.service
        owner: root
        group: root
        mode: "0644"
      notify:
        - Reload systemd daemon
        - Restart aoc-bench service

    - name: Flush handlers
      ansible.builtin.meta: flush_handlers

    - name: Ensure aoc-bench service is enabled and running
      ansible.builtin.systemd:
        name: aoc-bench.service
        enabled: true
        state: started

  handlers:
    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart aoc-bench service
      ansible.builtin.systemd:
        name: aoc-bench.service
        state: restarted

# rbench: one-off benchmark binaries pushed over SSH, see README.md.
- name: Configure rbench
  hosts: bench_hosts
  become: true
  tags: rbench

  vars:
    rbench_user: rbench
    # The bench user's key unless a host sets rbench_ssh_pubkeys
    rbench_keys: "{{ rbench_ssh_pubkeys | default([bench_ssh_pubkey]) }}"
    rbench_files:
      - /etc/systemd/system/aoc-bench-watchdog.timer
      - /etc/systemd/system/aoc-bench-watchdog.service
      - /etc/ssh/sshd_config.d/aoc-bench-rbench.conf
      - /etc/polkit-1/rules.d/50-aoc-bench-rbench.rules
      - /etc/tmpfiles.d/aoc-bench-rbench.conf
      - /usr/local/libexec/aoc-bench-rbench
      - /usr/local/libexec/aoc-bench-watchdog
      - /run/aoc-bench-rbench

  tasks:
    - name: Validate rbench SSH keys
      ansible.builtin.assert:
        that:
          - rbench_keys is sequence
          - rbench_keys is not string
          - rbench_keys | length > 0
        fail_msg: >-
          rbench_ssh_pubkeys must be a non-empty YAML list of public keys.
      when: bench_enable_rbench | bool

    # The login shell must be real as sshd runs ForceCommand through it. The
    # forced command is the only thing it ever runs. The password is locked so
    # only the public keys below can log in.
    - name: Ensure rbench user exists
      ansible.builtin.user:
        name: "{{ rbench_user }}"
        shell: /bin/bash
        create_home: true
        password_lock: true
        state: present
      when: bench_enable_rbench | bool

    - name: Add SSH keys for rbench user
      ansible.posix.authorized_key:
        user: "{{ rbench_user }}"
        key: "{{ item }}"
        state: present
      loop: "{{ rbench_keys }}"
      when: bench_enable_rbench | bool

    - name: Add rbench user to rapl group
      ansible.builtin.user:
        name: "{{ rbench_user }}"
        groups: rapl
        append: true
      when:
        - bench_enable_rbench | bool
        - power_limit_watts is defined

    - name: Install rbench scripts
      ansible.builtin.copy:
        src: "files/{{ item }}"
        dest: "/usr/local/libexec/{{ item }}"
        owner: root
        group: root
        mode: "0755"
      loop:
        - aoc-bench-rbench
        - aoc-bench-watchdog
      when: bench_enable_rbench | bool

    - name: Install rbench runtime directory config
      ansible.builtin.template:
        src: templates/aoc-bench-rbench.tmpfiles.conf.j2
        dest: /etc/tmpfiles.d/aoc-bench-rbench.conf
        owner: root
        group: root
        mode: "0644"
      register: rbench_tmpfiles
      when: bench_enable_rbench | bool

    - name: Create rbench runtime directory
      ansible.builtin.command: >-
        systemd-tmpfiles --create /etc/tmpfiles.d/aoc-bench-rbench.conf
      when:
        - bench_enable_rbench | bool
        - rbench_tmpfiles.changed or not (ansible_check_mode | default(false))
      changed_when: rbench_tmpfiles.changed

    - name: Install polkit rule for rbench user
      ansible.builtin.template:
        src: templates/50-aoc-bench-rbench.rules.j2
        dest: /etc/polkit-1/rules.d/50-aoc-bench-rbench.rules
        owner: root
        group: root
        mode: "0644"
      when: bench_enable_rbench | bool

    - name: Install aoc-bench-watchdog units
      ansible.builtin.template:
        src: "templates/{{ item.src }}"
        dest: "/etc/systemd/system/{{ item.dest }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - src: aoc-bench-watchdog.service.j2
          dest: aoc-bench-watchdog.service
        - src: aoc-bench-watchdog.timer.j2
          dest: aoc-bench-watchdog.timer
      notify:
        - Reload systemd daemon
      when: bench_enable_rbench | bool

    # The fragment is validated on its own before being written. The whole
    # configuration is validated below before sshd is reloaded, which catches
    # the fragment interacting badly with the main file.
    - name: Install sshd config for rbench user
      ansible.builtin.template:
        src: templates/sshd-aoc-bench-rbench.conf.j2
        dest: /etc/ssh/sshd_config.d/aoc-bench-rbench.conf
        owner: root
        group: root
        mode: "0644"
        validate: /usr/sbin/sshd -t -f %s
      notify:
        - Reload sshd
      when: bench_enable_rbench | bool

    - name: Validate complete sshd configuration
      ansible.builtin.command: /usr/sbin/sshd -t
      changed_when: false
      when: bench_enable_rbench | bool

    - name: Flush handlers
      ansible.builtin.meta: flush_handlers

    - name: Ensure aoc-bench-watchdog timer is enabled and running
      ansible.builtin.systemd:
        name: aoc-bench-watchdog.timer
        enabled: true
        state: started
      when: bench_enable_rbench | bool

    # Removal. service_facts only lists .service units, so the timer is
    # checked by its unit file.
    - name: Check whether aoc-bench-watchdog timer is installed
      ansible.builtin.stat:
        path: /etc/systemd/system/aoc-bench-watchdog.timer
      register: watchdog_timer
      when: not bench_enable_rbench | bool

    - name: Stop and disable aoc-bench-watchdog timer
      ansible.builtin.systemd:
        name: aoc-bench-watchdog.timer
        enabled: false
        state: stopped
      when:
        - not bench_enable_rbench | bool
        - watchdog_timer.stat.exists

    - name: Remove rbench files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ rbench_files }}"
      notify:
        - Reload systemd daemon
        - Reload sshd
      when: not bench_enable_rbench | bool

    - name: Remove rbench user
      ansible.builtin.user:
        name: "{{ rbench_user }}"
        state: absent
        remove: true
      when: not bench_enable_rbench | bool

  handlers:
    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Reload sshd
      ansible.builtin.systemd:
        name: ssh.service
        state: reloaded
