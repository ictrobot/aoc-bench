---
bench_home_vg: vg-nvme
bench_home_size: 128G

# With only two cores there are no spare cores for the runner process and background tasks. threads=1 runs alone on
# the isolated core, but multithreaded benchmarks also use the other core, sharing it with them.
bench_enable_tuned_cpu_partitioning: true
isolated_cores: "1"
bench_host_config:
  cpu_affinity: "0-1"
  config_overrides:
    - config:
        threads: "1"
      cpu_affinity: "1"

# Drop tsc=reliable as this host's TSC is unstable, and nohz_full as it breaks CPU time accounting here.
bench_tuned_overrides:
  bootloader:
    cmdline_aoc_bench_host: "-tsc=reliable nohz_full=${isolated_cores} rcu_nocbs=${isolated_cores}"

bench_profiles:
  - generic
bench_threads:
  - "1"
  - n
bench_multiversion:
  - default
  - Scalar
  - Array128
  - Array256
  - Array4096

bench_enable_web_export: false

bench_enable_rbench: false

# Push run metrics to the local vmagent, labelled like its scraped series
# yamllint disable rule:line-length
metrics_push_url: "http://127.0.0.1:8429/api/v1/import/prometheus?extra_label=job=aoc-bench&extra_label=instance=k8"
# yamllint enable rule:line-length

# yamllint disable rule:line-length
host_description: >-
  [aoc-rs](https://github.com/ictrobot/aoc-rs) benchmarks running on an AMD Athlon 64 X2 3800+.
# yamllint enable rule:line-length
