---
bench_home_vg: vg0
bench_home_size: 128G

bench_enable_tuned_cpu_partitioning: true
isolated_cores: "0-11"

bench_enable_web_export: true

bench_enable_rbench: true

# Sustained package power limit (PL1), see the README
power_limit_watts: 65

# Push run metrics to the local vmagent, labelled like its scraped series
# yamllint disable rule:line-length
metrics_push_url: "http://127.0.0.1:8429/api/v1/import/prometheus?extra_label=job=aoc-bench&extra_label=instance=raptor-bench"
# yamllint enable rule:line-length

# yamllint disable rule:line-length
host_description: >-
  [aoc-rs](https://github.com/ictrobot/aoc-rs) benchmarks running on a
  [Hetzner EX44](https://www.hetzner.com/dedicated-rootserver/ex44/) server with an
  [Intel i5-13500](https://www.intel.com/content/www/us/en/products/sku/230580/intel-core-i513500-processor-24m-cache-up-to-4-80-ghz/specifications.html).
  Benchmarks are isolated to the 6 P-cores.
# yamllint enable rule:line-length
